<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a1f">
<title>幸运大转盘</title>
<style>
  :root{
    --gold:#ffd76a;
    --gold-2:#ffb02e;
    --pink:#ff4d94;
    --ink:#0b0a1f;
    --panel:rgba(255,255,255,.055);
    --panel-brd:rgba(255,255,255,.12);
    --txt:#f2f0ff;
    --txt-dim:rgba(242,240,255,.62);
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",
                system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--txt);
    background:var(--ink);
    overflow-x:hidden;
    min-height:100%;
  }

  /* ---------------- 背景特效 ---------------- */
  .bg-fx{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:
      radial-gradient(1200px 800px at 15% -10%, #2a1a5e 0%, transparent 60%),
      radial-gradient(1000px 700px at 90% 0%, #4a1450 0%, transparent 55%),
      radial-gradient(900px 900px at 50% 120%, #10265e 0%, transparent 60%),
      linear-gradient(160deg,#0b0a1f 0%,#140d2b 45%,#0a0a1c 100%);
  }
  .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;
       animation:float 18s ease-in-out infinite}
  .orb.o1{width:420px;height:420px;left:-120px;top:8%;background:#7b2ff7}
  .orb.o2{width:360px;height:360px;right:-90px;top:22%;background:#ff2e88;
          animation-delay:-6s}
  .orb.o3{width:480px;height:480px;left:35%;bottom:-200px;background:#1e6bff;
          animation-delay:-11s}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    33%{transform:translate3d(40px,-50px,0) scale(1.12)}
    66%{transform:translate3d(-35px,35px,0) scale(.94)}
  }
  .grid-fx{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 72%);
    -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 72%);
  }

  #fx{position:fixed;inset:0;z-index:60;pointer-events:none}

  /* ---------------- 布局 ---------------- */
  .app{position:relative;z-index:5;max-width:1240px;margin:0 auto;
       padding:26px 20px 40px}

  header{display:flex;align-items:center;justify-content:space-between;
         gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .logo{
    width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
    font-size:26px;background:linear-gradient(145deg,#ffd76a,#ff8a3d 60%,#ff4d94);
    box-shadow:0 10px 26px rgba(255,138,61,.4),inset 0 1px 0 rgba(255,255,255,.55);
    animation:logoPulse 3.4s ease-in-out infinite;
  }
  @keyframes logoPulse{50%{transform:translateY(-3px) rotate(-4deg)}}
  h1{margin:0;font-size:clamp(20px,3.4vw,30px);letter-spacing:.5px;
     background:linear-gradient(92deg,#fff 0%,#ffd76a 45%,#ff8fb8 100%);
     -webkit-background-clip:text;background-clip:text;color:transparent;
     font-weight:800}
  .sub{margin:4px 0 0;font-size:13px;color:var(--txt-dim)}

  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .chip{
    display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
    background:var(--panel);border:1px solid var(--panel-brd);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    font-size:13px;color:var(--txt-dim);white-space:nowrap
  }
  .chip b{color:var(--gold);font-size:15px;font-variant-numeric:tabular-nums}

  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.75fr);
       gap:22px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr}}

  .panel{
    background:var(--panel);border:1px solid var(--panel-brd);border-radius:22px;
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:var(--shadow);
  }

  /* ---------------- 转盘 ---------------- */
  .stage{padding:22px 18px 18px;display:flex;flex-direction:column;
         align-items:center;gap:16px}
  .wheel-wrap{position:relative;width:100%;max-width:520px;aspect-ratio:1/1;
              display:grid;place-items:center;isolation:isolate}
  .wheel-wrap::before{
    content:"";position:absolute;inset:-6%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,183,80,.30) 0%,rgba(255,77,148,.16) 42%,transparent 70%);
    filter:blur(26px);z-index:-1;animation:halo 4s ease-in-out infinite
  }
  @keyframes halo{50%{opacity:.62;transform:scale(1.06)}}
  #wheel{width:100%;height:100%;display:block;
         filter:drop-shadow(0 16px 40px rgba(0,0,0,.5))}

  .pointer{
    position:absolute;top:-2.2%;left:50%;transform:translateX(-50%);
    width:0;height:0;z-index:6;
    border-left:15px solid transparent;border-right:15px solid transparent;
    border-top:34px solid var(--gold);
    filter:drop-shadow(0 4px 10px rgba(255,183,80,.85));
  }
  .pointer::after{
    content:"";position:absolute;left:-15px;top:-34px;
    width:30px;height:30px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff6d8,#ffb02e);
    box-shadow:0 0 16px rgba(255,183,80,.9)
  }
  .pointer.tick{animation:tick .09s ease-out}
  @keyframes tick{50%{transform:translateX(-50%) rotate(-9deg)}}

  .spin-btn{
    position:absolute;width:31%;aspect-ratio:1/1;border-radius:50%;border:0;
    cursor:pointer;z-index:5;display:grid;place-items:center;
    font-family:inherit;font-weight:800;letter-spacing:2px;
    font-size:clamp(15px,2.6vw,21px);color:#4a2500;
    background:
      radial-gradient(circle at 34% 28%,#fffbe8 0%,#ffe08a 32%,#ffb02e 68%,#f78b1b 100%);
    box-shadow:
      0 0 0 7px rgba(255,255,255,.10),
      0 0 0 12px rgba(255,183,80,.22),
      0 14px 34px rgba(255,138,61,.55),
      inset 0 -6px 14px rgba(180,90,0,.35),
      inset 0 5px 12px rgba(255,255,255,.85);
    transition:transform .16s ease, box-shadow .2s ease;
    animation:btnBreath 2.6s ease-in-out infinite;
  }
  @keyframes btnBreath{
    50%{box-shadow:0 0 0 7px rgba(255,255,255,.14),0 0 0 16px rgba(255,183,80,.14),
       0 18px 40px rgba(255,138,61,.6),inset 0 -6px 14px rgba(180,90,0,.35),
       inset 0 5px 12px rgba(255,255,255,.85)}
  }
  .spin-btn:hover:not(:disabled){transform:scale(1.055)}
  .spin-btn:active:not(:disabled){transform:scale(.955)}
  .spin-btn:disabled{cursor:not-allowed;filter:grayscale(.35) brightness(.9);
                     animation:none}
  .spin-btn span{pointer-events:none;text-shadow:0 1px 0 rgba(255,255,255,.6)}

  .hint{font-size:12.5px;color:var(--txt-dim);letter-spacing:.4px}
  kbd{background:rgba(255,255,255,.12);border:1px solid var(--panel-brd);
      border-radius:6px;padding:1px 7px;font-size:11.5px;font-family:inherit}

  /* ---------------- 侧栏 ---------------- */
  .side{display:flex;flex-direction:column;gap:18px}
  .panel-h{display:flex;align-items:center;justify-content:space-between;
           padding:15px 18px 11px;font-size:14px;font-weight:700}
  .panel-h .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);
                box-shadow:0 0 10px var(--gold);display:inline-block;margin-right:9px}
  .panel-h .t{display:flex;align-items:center}
  .panel-h small{font-weight:400;color:var(--txt-dim);font-size:11.5px}

  .prize-list{list-style:none;margin:0;padding:0 12px 14px;
              max-height:340px;overflow:auto}
  .prize-list li{display:flex;align-items:center;gap:11px;padding:9px 10px;
                 border-radius:13px;transition:background .18s}
  .prize-list li:hover{background:rgba(255,255,255,.06)}
  .prize-list li.out{opacity:.36;filter:grayscale(1)}
  .p-ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
         font-size:18px;flex:none;background:rgba(255,255,255,.08);
         border:1px solid rgba(255,255,255,.1)}
  .p-mid{flex:1;min-width:0}
  .p-name{font-size:13.2px;font-weight:600;white-space:nowrap;overflow:hidden;
          text-overflow:ellipsis}
  .p-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.10);
         margin-top:6px;overflow:hidden}
  .p-bar i{display:block;height:100%;border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .p-pct{font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;
         flex:none;min-width:52px;text-align:right;font-weight:700}
  .p-pct em{display:block;font-style:normal;font-size:10.5px;color:var(--txt-dim);
            font-weight:400;margin-top:2px}

  .hist{list-style:none;margin:0;padding:0 14px 14px;max-height:280px;overflow:auto}
  .hist li{display:flex;align-items:center;gap:10px;padding:9px 4px;
           border-bottom:1px dashed rgba(255,255,255,.08);font-size:13px}
  .hist li:last-child{border-bottom:0}
  .hist .h-ico{font-size:17px}
  .hist .h-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;
                text-overflow:ellipsis}
  .hist .h-time{font-size:11px;color:var(--txt-dim);flex:none;
                font-variant-numeric:tabular-nums}
  .empty{padding:22px 16px 26px;text-align:center;color:var(--txt-dim);
         font-size:12.5px;line-height:1.9}
  .empty .big{font-size:26px;display:block;margin-bottom:6px;opacity:.7}

  .btns{display:flex;gap:10px;padding:0 14px 16px}
  .btn{
    flex:1;padding:11px 14px;border-radius:13px;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:600;color:var(--txt);
    background:rgba(255,255,255,.07);border:1px solid var(--panel-brd);
    transition:all .18s;display:flex;align-items:center;justify-content:center;gap:7px
  }
  .btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-2));
            color:#422200;border-color:transparent;
            box-shadow:0 8px 22px rgba(255,176,46,.35)}

  /* ---------------- 结果弹窗 ---------------- */
  .modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;
         background:rgba(6,4,18,.72);backdrop-filter:blur(9px);
         -webkit-backdrop-filter:blur(9px);
         opacity:0;visibility:hidden;transition:opacity .32s,visibility .32s;
         padding:20px}
  .modal.show{opacity:1;visibility:visible}
  .card{
    position:relative;width:min(430px,92vw);border-radius:26px;padding:38px 30px 28px;
    text-align:center;overflow:hidden;
    background:linear-gradient(165deg,rgba(46,32,84,.96),rgba(20,14,42,.98));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.16);
    transform:translateY(26px) scale(.9);opacity:0;
    transition:transform .42s cubic-bezier(.2,1.3,.35,1),opacity .34s
  }
  .modal.show .card{transform:none;opacity:1}
  .card::before{
    content:"";position:absolute;inset:-45% -20% auto -20%;height:78%;
    background:radial-gradient(ellipse at 50% 0%,rgba(255,183,80,.5),transparent 68%);
    pointer-events:none
  }
  .card.lose::before{background:radial-gradient(ellipse at 50% 0%,rgba(120,150,255,.35),transparent 68%)}
  .ribbon{
    position:relative;display:inline-block;font-size:12px;letter-spacing:3px;
    color:var(--gold);margin-bottom:14px;font-weight:700
  }
  .card.lose .ribbon{color:#9db4ff}
  .r-ico{
    position:relative;font-size:74px;line-height:1;margin:6px 0 16px;
    display:inline-block;filter:drop-shadow(0 10px 26px rgba(255,183,80,.6));
    animation:pop .7s cubic-bezier(.2,1.5,.4,1)
  }
  @keyframes pop{0%{transform:scale(.3) rotate(-22deg);opacity:0}
                 62%{transform:scale(1.16) rotate(7deg)}
                 100%{transform:scale(1) rotate(0)}}
  .r-name{position:relative;font-size:clamp(21px,4.6vw,27px);font-weight:800;
          margin:0 0 10px;line-height:1.35;
          background:linear-gradient(92deg,#fff,#ffd76a 55%,#ff9fc4);
          -webkit-background-clip:text;background-clip:text;color:transparent}
  .card.lose .r-name{background:linear-gradient(92deg,#fff,#b9c7ff);
          -webkit-background-clip:text;background-clip:text;color:transparent}
  .r-desc{position:relative;font-size:13px;color:var(--txt-dim);margin:0 0 6px;
          line-height:1.7}
  .r-meta{position:relative;font-size:12px;color:var(--txt-dim);margin:12px 0 22px;
          font-variant-numeric:tabular-nums}
  .r-meta span{color:var(--gold)}
  .card .btns{padding:0}
  .card .btn{padding:13px}

  /* 提示条 */
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,22px);z-index:90;
    padding:12px 22px;border-radius:999px;font-size:13.5px;
    background:rgba(30,20,60,.95);border:1px solid var(--panel-brd);
    box-shadow:var(--shadow);opacity:0;transition:all .3s;pointer-events:none
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------------- 连接状态 ---------------- */
  .conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;
    background:#3ecf8e;box-shadow:0 0 8px rgba(62,207,142,.7);transition:all .3s}
  .conn-dot.offline{background:#ff5b5b;box-shadow:0 0 8px rgba(255,91,91,.7)}
  .conn-dot.connecting{background:#ffd76a;box-shadow:0 0 8px rgba(255,215,106,.7);
    animation:connPulse 1s ease-in-out infinite}
  @keyframes connPulse{50%{opacity:.4}}

  /* ---------------- 加载旋转 ---------------- */
  .spin-btn .spinner{
    display:none;width:22px;height:22px;border:3px solid rgba(74,37,0,.3);
    border-top-color:#4a2500;border-radius:50%;animation:spin .6s linear infinite
  }
  .spin-btn.loading .spinner{display:block}
  .spin-btn.loading span{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------------- 统计面板 ---------------- */
  .stats-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .stat-mini{
    flex:1;min-width:80px;text-align:center;padding:10px 8px;border-radius:13px;
    background:rgba(255,255,255,.05);border:1px solid var(--panel-brd)
  }
  .stat-mini .v{font-size:18px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  .stat-mini .l{font-size:11px;color:var(--txt-dim);margin-top:3px}

  /* ---------------- 错误重试条 ---------------- */
  .retry-bar{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,22px);z-index:88;
    display:flex;align-items:center;gap:12px;padding:12px 20px;border-radius:14px;
    background:rgba(60,20,20,.96);border:1px solid rgba(255,91,91,.35);
    box-shadow:var(--shadow);opacity:0;transition:all .3s;pointer-events:none
  }
  .retry-bar.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .retry-bar .msg{font-size:13px;color:#ffb0b0}
  .retry-bar button{
    padding:7px 16px;border-radius:8px;border:0;cursor:pointer;font-size:12.5px;
    font-weight:700;color:#fff;background:linear-gradient(135deg,#ff5b5b,#ff3d81)
  }

  /* ---------------- 移动端优化 ---------------- */
  @media(max-width:600px){
    .app{padding:14px 12px 30px}
    .brand .logo{width:42px;height:42px;font-size:22px;border-radius:13px}
    h1{font-size:20px}
    .sub{font-size:11.5px}
    .chip{padding:7px 12px;font-size:12px}
    .chip b{font-size:13px}
    .stage{padding:14px 10px 12px}
    .panel-h{padding:12px 14px 9px;font-size:13px}
    .prize-list{max-height:280px}
    .hist{max-height:220px}
    .card{padding:30px 22px 22px;border-radius:22px}
    .r-ico{font-size:58px}
    .stats-row{gap:6px}
    .stat-mini{min-width:60px;padding:8px 6px}
    .stat-mini .v{font-size:15px}
  }

  /* ---------------- 无障碍/减弱动画 ---------------- */
  @media(prefers-reduced-motion:reduce){
    .orb,.logo,.spin-btn,.pointer.tick,.card::before,.conn-dot.connecting{
      animation:none!important}
    *{transition-duration:.01ms!important;animation-duration:.01ms!important}
  }

  /* ---------------- PWA ---------------- */
  .install-btn{
    display:none;padding:7px 14px;border-radius:10px;border:0;cursor:pointer;
    font-size:12.5px;font-weight:700;color:#422200;font-family:inherit;
    background:linear-gradient(135deg,var(--gold),var(--gold-2));
    box-shadow:0 6px 18px rgba(255,176,46,.3)
  }
  .install-btn.show{display:inline-flex;align-items:center;gap:6px}
</style>
</head>
<body>

<div class="bg-fx">
  <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  <span class="grid-fx"></span>
</div>

<canvas id="fx"></canvas>

<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🎡</div>
      <div>
        <h1 id="title">幸运大转盘</h1>
        <p class="sub" id="subtitle">转动转盘，好运即刻降临</p>
      </div>
    </div>
    <div class="stats">
      <div class="chip" id="connChip"><span class="conn-dot" id="connDot"></span><span id="connLabel">在线</span></div>
      <div class="chip">🎯 已抽奖 <b id="statDraws">0</b> 次</div>
      <div class="chip">🎁 奖品 <b id="statKinds">0</b> 种</div>
      <div class="chip" id="soundChip" style="cursor:pointer">🔊 音效</div>
      <button class="install-btn" id="installBtn">📦 安装应用</button>
    </div>
  </header>

  <main>
    <section class="panel stage">
      <div class="wheel-wrap">
        <canvas id="wheel"></canvas>
        <div class="pointer" id="pointer"></div>
        <button class="spin-btn" id="spin"><span>抽 奖</span><div class="spinner"></div></button>
      </div>
      <div class="hint">点击 <b>抽奖</b> 按钮或按 <kbd>空格</kbd> 开始 · 结果由服务端按概率实时抽取</div>
      <div class="stats-row">
        <div class="stat-mini"><div class="v" id="miniDraws">0</div><div class="l">总抽奖</div></div>
        <div class="stat-mini"><div class="v" id="miniWins">0</div><div class="l">中奖数</div></div>
        <div class="stat-mini"><div class="v" id="miniRemaining">∞</div><div class="l">限量余量</div></div>
      </div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panel-h">
          <div class="t"><i class="dot"></i>奖池与概率</div>
          <small id="poolSum">合计 100%</small>
        </div>
        <ul class="prize-list" id="prizeList"></ul>
      </div>

      <div class="panel">
        <div class="panel-h">
          <div class="t"><i class="dot"></i>抽奖记录</div>
          <small id="histCount">0 条</small>
        </div>
        <ul class="hist" id="histList"></ul>
        <div class="btns">
          <button class="btn" id="btnRefresh">🔄 刷新配置</button>
          <button class="btn" id="btnReset">🧹 清空记录</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="modal">
  <div class="card" id="card">
    <div class="ribbon" id="ribbon">恭 喜 中 奖</div>
    <div class="r-ico" id="rIco">🎁</div>
    <h2 class="r-name" id="rName">奖品名称</h2>
    <p class="r-desc" id="rDesc"></p>
    <p class="r-meta" id="rMeta"></p>
    <div class="btns">
      <button class="btn gold" id="btnAgain">🎲 再抽一次</button>
      <button class="btn" id="btnClose">关闭</button>
    </div>
  </div>
</div>

<div class="retry-bar" id="retryBar">
  <span class="msg" id="retryMsg">连接已断开</span>
  <button id="retryBtn">重试</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const TAU = Math.PI * 2;
  const TOP = -Math.PI / 2;          // 指针所在角度（正上方）
  const PALETTE = ["#ff4d94","#ffb02e","#4d8cff","#00d4b8","#a55eea",
                   "#ff5b5b","#7bed9f","#26c6da","#ffd93d","#f368e0",
                   "#54a0ff","#1dd1a1","#ee5253","#feca57","#48dbfb"];

  const $ = (id) => document.getElementById(id);
  const wheelCv = $("wheel"), wctx = wheelCv.getContext("2d");
  const fxCv = $("fx"), fctx = fxCv.getContext("2d");
  const spinBtn = $("spin"), pointer = $("pointer");

  const S = {
    config: null,
    prizes: [],
    segs: [],            // {start,end,mid,prize}
    rotation: 0,
    spinning: false,
    phase: 0,
    history: [],
    sig: "",
    sound: true,
    lastTick: 0,
    flash: 0,            // 中奖闪光强度
    online: true,        // 连接状态
    winCount: 0,         // 中奖计数
    retryTimer: null,    // 重试计时器
  };

  /* ================= 工具 ================= */

  function hex2rgb(hex) {
    let h = String(hex || "").replace("#", "").trim();
    if (h.length === 3) h = h.split("").map(c => c + c).join("");
    if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function rgba(hex, a) {
    const c = hex2rgb(hex);
    return c ? `rgba(${c[0]},${c[1]},${c[2]},${a})` : `rgba(140,150,190,${a})`;
  }
  function shade(hex, k) {
    const c = hex2rgb(hex) || [130,140,180];
    const f = (v) => Math.max(0, Math.min(255, Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k)));
    return `rgb(${f(c[0])},${f(c[1])},${f(c[2])})`;
  }
  const easeOutQuint = (t) => 1 - Math.pow(1 - t, 5);

  function toast(msg, ms) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), ms || 2200);
  }

  /* ================= 连接状态管理 ================= */

  function setConnState(state) {
    const dot = $("connDot"), label = $("connLabel");
    dot.className = "conn-dot " + state;
    label.textContent = state === "online" ? "在线" : state === "connecting" ? "连接中" : "离线";
    S.online = (state === "online");
  }

  function showRetryBar(msg) {
    $("retryMsg").textContent = msg || "连接已断开";
    $("retryBar").classList.add("show");
    if (S.retryTimer) clearTimeout(S.retryTimer);
    // 5 秒后自动重试
    S.retryTimer = setTimeout(() => doRetry(), 5000);
  }

  function hideRetryBar() {
    $("retryBar").classList.remove("show");
    if (S.retryTimer) { clearTimeout(S.retryTimer); S.retryTimer = null; }
  }

  function doRetry() {
    hideRetryBar();
    setConnState("connecting");
    loadConfig(true, true).then(() => {
      setConnState("online");
      loadHistory();
    }).catch(() => {
      setConnState("offline");
      showRetryBar("连接失败，正在重试…");
    });
  }

  /* ================= 网络请求封装（超时+重试） ================= */

  function fetchWithTimeout(url, opts, timeoutMs) {
    opts = opts || {};
    timeoutMs = timeoutMs || 8000;
    const ctrl = new AbortController();
    opts.signal = ctrl.signal;
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    return fetch(url, opts).finally(() => clearTimeout(timer));
  }

  async function apiGet(path, timeoutMs) {
    const r = await fetchWithTimeout(path, { method: "GET", cache: "no-store" }, timeoutMs);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || "API error");
    return d;
  }

  async function apiPost(path, timeoutMs) {
    const r = await fetchWithTimeout(path, { method: "POST" }, timeoutMs);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    return d;
  }

  /* ================= 音效（WebAudio 合成，无需素材） ================= */

  let AC = null;
  function ac() {
    if (!AC) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (C) AC = new C();
    }
    if (AC && AC.state === "suspended") AC.resume();
    return AC;
  }
  function beep(freq, dur, type, gain) {
    if (!S.sound) return;
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0, a.currentTime);
    g.gain.linearRampToValueAtTime(gain == null ? 0.07 : gain, a.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function tickSound() {
    beep(1150 + Math.random() * 260, 0.035, "square", 0.035);
  }
  function winSound() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => setTimeout(() => beep(f, 0.42, "triangle", 0.075), i * 105));
    setTimeout(() => beep(1318.5, 0.9, "sine", 0.05), 460);
  }
  function loseSound() {
    beep(392, 0.28, "sine", 0.05);
    setTimeout(() => beep(311, 0.42, "sine", 0.05), 170);
  }

  /* ================= 画布尺寸 ================= */

  function fitCanvas(cv, ctx) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
    if (cv.width !== w * dpr || cv.height !== h * dpr) {
      cv.width = w * dpr; cv.height = h * dpr;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { w, h };
  }

  /* ================= 转盘绘制 ================= */

  function buildSegs() {
    const prizes = S.prizes || [];
    const total = prizes.reduce((s, p) => s + (p.probability || 0), 0) || 1;
    const segs = [];
    let acc = 0;
    for (let i = 0; i < prizes.length; i++) {
      const span = ((prizes[i].probability || 0) / total) * TAU;
      const start = acc, end = acc + span;
      segs.push({ start, end, mid: (start + end) / 2, prize: prizes[i], i });
      acc = end;
    }
    S.segs = segs;
  }

  function drawWheel() {
    const { w, h } = fitCanvas(wheelCv, wctx);
    const cx = w / 2, cy = h / 2;
    const R = Math.min(cx, cy) - 14;
    if (R <= 10) return;

    wctx.clearRect(0, 0, w, h);

    /* --- 外圈 --- */
    wctx.save();
    const ringGrad = wctx.createLinearGradient(0, cy - R, 0, cy + R);
    ringGrad.addColorStop(0, "#ffe9a8");
    ringGrad.addColorStop(.35, "#ffb02e");
    ringGrad.addColorStop(.6, "#ff7a3d");
    ringGrad.addColorStop(1, "#c95c12");
    wctx.beginPath();
    wctx.arc(cx, cy, R + 8, 0, TAU);
    wctx.fillStyle = ringGrad;
    wctx.fill();

    wctx.beginPath();
    wctx.arc(cx, cy, R + 1, 0, TAU);
    wctx.strokeStyle = "rgba(90,45,0,.45)";
    wctx.lineWidth = 1.5;
    wctx.stroke();
    wctx.restore();

    /* --- 灯泡 --- */
    const bulbs = 24;
    for (let i = 0; i < bulbs; i++) {
      const a = (i / bulbs) * TAU - Math.PI / 2;
      const bx = cx + Math.cos(a) * (R + 4.5);
      const by = cy + Math.sin(a) * (R + 4.5);
      const k = 0.5 + 0.5 * Math.sin(S.phase * 2.4 + i * 0.55);
      const rad = 2.6 + k * 2.4;
      const g = wctx.createRadialGradient(bx, by, 0, bx, by, rad * 3.4);
      g.addColorStop(0, `rgba(255,255,235,${0.85 * k + 0.15})`);
      g.addColorStop(.4, `rgba(255,214,110,${0.55 * k})`);
      g.addColorStop(1, "rgba(255,180,60,0)");
      wctx.beginPath();
      wctx.arc(bx, by, rad * 3.4, 0, TAU);
      wctx.fillStyle = g;
      wctx.fill();
      wctx.beginPath();
      wctx.arc(bx, by, rad * 0.62, 0, TAU);
      wctx.fillStyle = `rgba(255,${Math.round(235 - 40 * (1 - k))},${Math.round(190 + 60 * k)},${0.55 + 0.45 * k})`;
      wctx.fill();
    }

    /* --- 扇形 --- */
    wctx.save();
    wctx.translate(cx, cy);
    wctx.rotate(S.rotation);

    const segs = S.segs;
    for (const seg of segs) {
      const p = seg.prize;
      const base = p.color || PALETTE[seg.i % PALETTE.length];

      wctx.beginPath();
      wctx.moveTo(0, 0);
      wctx.arc(0, 0, R, seg.start, seg.end);
      wctx.closePath();

      const g = wctx.createRadialGradient(0, 0, R * 0.12, 0, 0, R);
      g.addColorStop(0, shade(base, 0.34));
      g.addColorStop(.62, base);
      g.addColorStop(1, shade(base, -0.30));
      wctx.fillStyle = g;
      wctx.fill();

      wctx.strokeStyle = "rgba(255,255,255,.30)";
      wctx.lineWidth = 1.2;
      wctx.stroke();
    }

    /* --- 文字与图标 --- */
    for (const seg of segs) {
      const p = seg.prize;
      const span = seg.end - seg.start;
      const mid = seg.mid;

      wctx.save();
      wctx.rotate(mid);

      const norm = ((mid % TAU) + TAU) % TAU;
      const flip = norm > Math.PI / 2 && norm < Math.PI * 1.5;
      if (flip) wctx.rotate(Math.PI);

      wctx.textAlign = flip ? "left" : "right";
      wctx.textBaseline = "middle";
      wctx.fillStyle = "rgba(255,255,255,.97)";
      wctx.shadowColor = "rgba(0,0,0,.45)";
      wctx.shadowBlur = 6;

      const tx = flip ? -(R - 20) : (R - 20);
      const icoSize = Math.max(13, Math.min(R * 0.135, 30));
      const txtSize = Math.max(9.5, Math.min(R * 0.072, 16));
      const maxW = R * 0.80;

      wctx.font = `${icoSize}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
      wctx.fillText(p.icon || "🎁", tx, -txtSize * 0.95, maxW);

      wctx.font = `700 ${txtSize}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
      wctx.fillText(p.name || "", tx, txtSize * 1.15, maxW);

      if (span > 0.30 && p.stock !== null && p.stock !== undefined) {
        wctx.font = `500 ${txtSize * 0.72}px "PingFang SC","Microsoft YaHei",system-ui,sans-serif`;
        wctx.fillStyle = "rgba(255,255,255,.72)";
        const left = (p.remaining === null || p.remaining === undefined) ? p.stock : p.remaining;
        wctx.fillText(`剩 ${left}`, tx, txtSize * 2.9, maxW);
      }

      wctx.restore();
    }

    /* --- 中心底盘 --- */
    wctx.beginPath();
    wctx.arc(0, 0, R * 0.235, 0, TAU);
    const cg = wctx.createRadialGradient(0, -R * 0.06, 0, 0, 0, R * 0.235);
    cg.addColorStop(0, "rgba(255,255,255,.98)");
    cg.addColorStop(.55, "rgba(255,224,150,.95)");
    cg.addColorStop(1, "rgba(255,160,50,.95)");
    wctx.fillStyle = cg;
    wctx.fill();
    wctx.strokeStyle = "rgba(255,255,255,.75)";
    wctx.lineWidth = 2;
    wctx.stroke();

    wctx.restore();

    /* --- 中奖闪光 --- */
    if (S.flash > 0.001) {
      wctx.save();
      const fg = wctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R * 1.25);
      fg.addColorStop(0, `rgba(255,255,255,${0.42 * S.flash})`);
      fg.addColorStop(.55, `rgba(255,214,110,${0.28 * S.flash})`);
      fg.addColorStop(1, "rgba(255,180,60,0)");
      wctx.beginPath();
      wctx.arc(cx, cy, R * 1.25, 0, TAU);
      wctx.fillStyle = fg;
      wctx.fill();
      wctx.restore();
    }
  }

  /* ================= 粒子特效 ================= */

  const parts = [];
  const CONFETTI = ["#ffd76a","#ff4d94","#4d8cff","#00d4b8","#a55eea",
                    "#ff5b5b","#7bed9f","#ffffff","#ffb02e"];

  function spawnBurst(cx, cy, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * TAU;
      const sp = (0.35 + Math.random() * 1) * (power || 1);
      parts.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp * 13,
        vy: Math.sin(a) * sp * 13 - 3,
        g: 0.30 + Math.random() * 0.22,
        life: 1, decay: 0.008 + Math.random() * 0.010,
        size: 4 + Math.random() * 7,
        color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 0.42,
        shape: Math.random() < 0.72 ? "rect" : "circle",
      });
    }
  }
  function spawnFountain(cx, cy, count) {
    for (let i = 0; i < count; i++) {
      parts.push({
        x: cx + (Math.random() - 0.5) * 40,
        y: cy,
        vx: (Math.random() - 0.5) * 8,
        vy: -(9 + Math.random() * 11),
        g: 0.34,
        life: 1, decay: 0.007 + Math.random() * 0.008,
        size: 4 + Math.random() * 6,
        color: CONFETTI[(Math.random() * CONFETTI.length) | 0],
        rot: Math.random() * TAU,
        vr: (Math.random() - 0.5) * 0.5,
        shape: Math.random() < 0.6 ? "rect" : "circle",
      });
    }
  }
  function spawnRing(cx, cy, color) {
    parts.push({ ring: true, x: cx, y: cy, r: 10, life: 1, decay: 0.028,
                 color: color || "#ffd76a" });
  }

  function drawParts(dt) {
    const { w, h } = fitCanvas(fxCv, fctx);
    fctx.clearRect(0, 0, w, h);
    if (!parts.length) return;

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];

      if (p.ring) {
        p.r += 13 * dt;
        p.life -= p.decay * dt;
        if (p.life <= 0) { parts.splice(i, 1); continue; }
        fctx.save();
        fctx.globalAlpha = Math.max(0, p.life) * 0.7;
        fctx.strokeStyle = p.color;
        fctx.lineWidth = 5 * p.life;
        fctx.beginPath();
        fctx.arc(p.x, p.y, p.r, 0, TAU);
        fctx.stroke();
        fctx.restore();
        continue;
      }

      p.vy += p.g * dt;
      p.vx *= Math.pow(0.988, dt);
      p.vy *= Math.pow(0.994, dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= p.decay * dt;

      if (p.life <= 0 || p.y > h + 60) { parts.splice(i, 1); continue; }

      fctx.save();
      fctx.globalAlpha = Math.min(1, p.life * 1.5);
      fctx.translate(p.x, p.y);
      fctx.rotate(p.rot);
      fctx.fillStyle = p.color;
      fctx.shadowColor = p.color;
      fctx.shadowBlur = 10;
      if (p.shape === "rect") {
        fctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        fctx.beginPath();
        fctx.arc(0, 0, p.size / 2.2, 0, TAU);
        fctx.fill();
      }
      fctx.restore();
    }
  }

  /* ================= 渲染主循环 ================= */

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(2.6, (now - lastT) / 16.667) || 1;
    lastT = now;
    S.phase += 0.045 * dt;
    if (S.flash > 0) S.flash = Math.max(0, S.flash - 0.018 * dt);
    drawWheel();
    drawParts(dt);
    requestAnimationFrame(loop);
  }

  /* ================= 抽奖流程 ================= */

  function spin() {
    if (S.spinning) return;
    if (!S.segs.length) { toast("奖池为空，请检查 prizes.json"); return; }
    if (!S.online) { toast("与服务端断开连接，请稍后重试"); return; }
    ac();  // 解锁音频

    S.spinning = true;
    spinBtn.disabled = true;
    spinBtn.classList.add("loading");

    apiPost("/api/draw", 10000)
      .then(data => {
        if (!data.ok) {
          S.spinning = false; spinBtn.disabled = false;
          spinBtn.classList.remove("loading");
          toast(data.error || "抽奖失败");
          return;
        }
        applyPrizes(data.prizes);
        animateTo(data.result);
      })
      .catch(err => {
        S.spinning = false; spinBtn.disabled = false;
        spinBtn.classList.remove("loading");
        if (err.name === "AbortError") {
          toast("请求超时，请检查网络后重试");
          setConnState("offline");
          showRetryBar("抽奖请求超时");
        } else {
          toast("无法连接服务端：" + err.message);
          setConnState("offline");
          showRetryBar("连接已断开");
        }
      });
  }

  function animateTo(result) {
    const seg = S.segs[result.index] || S.segs[0];
    const half = (seg.end - seg.start) / 2;
    const jitter = (Math.random() * 2 - 1) * half * 0.62;   // 落点不总在正中，更自然

    const cur = S.rotation;
    let target = TOP + jitter - seg.mid;                     // 目标角（等价类）
    const turns = 6 + Math.floor(Math.random() * 4);         // 多转几圈
    const k = Math.ceil((cur + turns * TAU - target) / TAU);
    target += k * TAU;

    const dur = 5200 + Math.random() * 900;
    const t0 = performance.now();
    let prev = cur;

    (function step(now) {
      const t = Math.min(1, (now - t0) / dur);
      const e = easeOutQuint(t);
      const ang = cur + (target - cur) * e;
      S.rotation = ang;

      // 过格音效 + 指针抖动
      if (Math.abs(ang - prev) > 0.02) {
        const segIdx = Math.floor((((TOP - ang) % TAU) + TAU) % TAU / (TAU / Math.max(1, S.segs.length)));
        if (segIdx !== S.lastTick) {
          S.lastTick = segIdx;
          if (t < 0.93) {
            tickSound();
            pointer.classList.remove("tick");
            void pointer.offsetWidth;
            pointer.classList.add("tick");
          }
        }
        prev = ang;
      }

      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        S.rotation = target;
        finish(result);
      }
    })(t0);
  }

  function finish(result) {
    const isWin = !/谢谢|未中奖|感谢参与|再来一次|下次/.test(result.name || "");
    const wrap = document.querySelector(".wheel-wrap").getBoundingClientRect();
    const cx = wrap.left + wrap.width / 2;
    const cy = wrap.top + wrap.height / 2;

    S.flash = 1;
    spawnRing(cx, cy, isWin ? "#ffd76a" : "#8fa8ff");
    spawnBurst(cx, cy, isWin ? 150 : 55, isWin ? 1.25 : 0.7);
    if (isWin) {
      setTimeout(() => spawnBurst(cx, cy - 40, 90, 1.1), 170);
      setTimeout(() => spawnFountain(cx, wrap.bottom - 30, 70), 330);
      winSound();
    } else {
      loseSound();
    }

    S.history.unshift(result);
    if (S.history.length > 60) S.history.pop();
    renderHistory();
    bumpDraws(result.draws);

    // 统计面板更新
    if (isWin) S.winCount++;
    updateMiniStats(result.draws || S.history.length, S.winCount);
    setConnState("online");
    hideRetryBar();

    // 更新概率面板中的剩余数量
    refreshPoolView();

    setTimeout(() => showModal(result, isWin), isWin ? 520 : 320);

    S.spinning = false;
    spinBtn.disabled = false;
    spinBtn.classList.remove("loading");
  }

  /* ================= 结果弹窗 ================= */

  function showModal(result, isWin) {
    const card = $("card");
    card.classList.toggle("lose", !isWin);
    $("ribbon").textContent = isWin ? "恭 喜 中 奖" : "很 遗 憾";
    $("rIco").textContent = result.icon || (isWin ? "🎁" : "🍀");
    $("rName").textContent = result.name || "未知奖品";
    $("rDesc").textContent = result.desc || (isWin
      ? "奖品已记入您的抽奖记录，请及时联系主办方领取。"
      : "别灰心，下一次说不定就是你了！");
    const bits = ["第 <span>" + (result.draws || "-") + "</span> 次抽奖",
                  "<span>" + (result.time || "") + "</span>"];
    if (result.remaining !== null && result.remaining !== undefined) {
      bits.push("剩余 <span>" + result.remaining + "</span> 份");
    }
    $("rMeta").innerHTML = bits.join(" · ");

    // 重置图标动画
    const ico = $("rIco");
    ico.style.animation = "none";
    void ico.offsetWidth;
    ico.style.animation = "";

    $("modal").classList.add("show");
  }
  function hideModal() { $("modal").classList.remove("show"); }

  /* ================= 面板渲染 ================= */

  function bumpDraws(n) {
    if (n === null || n === undefined) return;
    $("statDraws").textContent = n;
  }

  function updateMiniStats(draws, wins) {
    $("miniDraws").textContent = draws;
    $("miniWins").textContent = wins;
    // 限量奖品剩余总量
    let totalLeft = 0, hasStock = false;
    (S.prizes || []).forEach(p => {
      if (p.stock !== null && p.stock !== undefined) {
        hasStock = true;
        const left = (p.remaining !== null && p.remaining !== undefined) ? p.remaining : p.stock;
        totalLeft += left;
      }
    });
    $("miniRemaining").textContent = hasStock ? totalLeft : "∞";
  }

  function refreshPoolView() {
    // 用最新 prizes 重绘概率列表（服务端已返回 remaining）
    renderPrizes();
  }

  function applyPrizes(prizes) {
    if (!Array.isArray(prizes)) return;
    // 保留已有的 remaining 信息即可
    S.prizes = prizes;
    buildSegs();
  }

  function renderPrizes() {
    const ul = $("prizeList");
    ul.innerHTML = "";
    const prizes = S.prizes || [];
    let sum = 0;

    prizes.forEach((p, i) => {
      const pct = (p.probability || 0) * 100;
      sum += pct;
      const out = (p.remaining === 0);
      const li = document.createElement("li");
      if (out) li.className = "out";

      const color = p.color || PALETTE[i % PALETTE.length];
      const leftTxt = (p.stock === null || p.stock === undefined)
        ? "不限量"
        : ("剩 " + (p.remaining === null || p.remaining === undefined ? p.stock : p.remaining) + "/" + p.stock);

      li.innerHTML =
        '<div class="p-ico">' + escapeHtml(p.icon || "🎁") + '</div>' +
        '<div class="p-mid">' +
          '<div class="p-name">' + escapeHtml(p.name || "") + '</div>' +
          '<div class="p-bar"><i style="width:' + Math.min(100, Math.max(1.5, pct)) +
            '%;background:linear-gradient(90deg,' + color + ',' + shade(color, 0.4) + ')"></i></div>' +
        '</div>' +
        '<div class="p-pct">' + fmtPct(pct) + '<em>' + leftTxt + '</em></div>';
      ul.appendChild(li);
    });

    $("statKinds").textContent = prizes.length;
    $("poolSum").textContent = "合计 " + fmtPct(sum);
  }

  function fmtPct(v) {
    if (v >= 10) return v.toFixed(1).replace(/\.0$/, "") + "%";
    if (v >= 1) return v.toFixed(2).replace(/0$/, "").replace(/\.$/, "") + "%";
    return v.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") + "%";
  }

  function renderHistory() {
    const ul = $("histList");
    ul.innerHTML = "";
    $("histCount").textContent = S.history.length + " 条";
    if (!S.history.length) {
      ul.innerHTML = '<div class="empty"><span class="big">🗒️</span>还没有抽奖记录<br>点击「抽奖」开始你的好运</div>';
      return;
    }
    S.history.forEach(r => {
      const li = document.createElement("li");
      const t = (r.time || "").split(" ")[1] || r.time || "";
      li.innerHTML =
        '<span class="h-ico">' + escapeHtml(r.icon || "🎁") + '</span>' +
        '<span class="h-name">' + escapeHtml(r.name || "") + '</span>' +
        '<span class="h-time">' + escapeHtml(t) + '</span>';
      ul.appendChild(li);
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  /* ================= 配置加载 ================= */

  function configSig(cfg) {
    return (cfg.prizes || []).map(p =>
      [p.name, p.probability, p.stock, p.remaining, p.color, p.icon].join("|")
    ).join("~");
  }

  function applyConfig(cfg, force) {
    const sig = configSig(cfg);
    if (!force && sig === S.sig) return;
    S.sig = sig;
    S.config = cfg;
    S.prizes = cfg.prizes || [];
    $("title").textContent = cfg.title || "幸运大转盘";
    $("subtitle").textContent = cfg.subtitle || "";
    document.title = cfg.title || "幸运大转盘";
    buildSegs();
    renderPrizes();
    if (cfg.draws !== undefined) bumpDraws(cfg.draws);
  }

  function loadConfig(force, silent) {
    setConnState("connecting");
    return apiGet("/api/config", 8000)
      .then(d => {
        if (d.ok) {
          applyConfig(d.config, force);
          setConnState("online");
          hideRetryBar();
          if (!silent) toast("配置已更新");
        }
      })
      .catch(err => {
        setConnState("offline");
        if (!silent) toast("配置读取失败：" + err.message);
        showRetryBar("无法连接服务端");
      });
  }

  function loadHistory() {
    return apiGet("/api/history", 8000)
      .then(d => {
        if (d.ok) {
          S.history = d.history || [];
          renderHistory();
          bumpDraws(d.draws || 0);
          updateMiniStats(d.draws || 0, S.winCount);
        }
      })
      .catch(() => {});
  }

  /* ================= 事件绑定 ================= */

  spinBtn.addEventListener("click", spin);
  $("btnAgain").addEventListener("click", () => { hideModal(); setTimeout(spin, 240); });
  $("btnClose").addEventListener("click", hideModal);
  $("modal").addEventListener("click", e => { if (e.target.id === "modal") hideModal(); });

  $("btnRefresh").addEventListener("click", () => loadConfig(true, false));

  $("btnReset").addEventListener("click", () => {
    if (!confirm("确定要清空全部抽奖记录与库存用量吗？")) return;
    apiPost("/api/reset", 8000)
      .then(() => {
        S.history = [];
        S.winCount = 0;
        renderHistory();
        bumpDraws(0);
        updateMiniStats(0, 0);
        toast("已清空记录");
        return loadConfig(true, true);
      })
      .catch(() => toast("操作失败"));
  });

  $("retryBtn").addEventListener("click", doRetry);

  /* ================= PWA 安装 ================= */
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    $("installBtn").classList.add("show");
  });
  $("installBtn").addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === "accepted") toast("应用已安装");
    deferredPrompt = null;
    $("installBtn").classList.remove("show");
  });

  $("soundChip").addEventListener("click", () => {
    S.sound = !S.sound;
    $("soundChip").innerHTML = (S.sound ? "🔊" : "🔇") + " 音效";
    if (S.sound) beep(880, 0.12, "triangle", 0.06);
  });

  document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.key === " ") {
      e.preventDefault();
      if ($("modal").classList.contains("show")) { hideModal(); return; }
      spin();
    } else if (e.key === "Escape") {
      hideModal();
    }
  });

  let rt = null;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => { drawWheel(); fitCanvas(fxCv, fctx); }, 120);
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !S.spinning) loadConfig(false, true);
  });

  /* ================= 启动 ================= */

  fitCanvas(fxCv, fctx);
  requestAnimationFrame(loop);
  loadConfig(true, true).then(loadHistory);
  setInterval(() => { if (!S.spinning) loadConfig(false, true); }, 5000);

})();
</script>
</body>
</html>
